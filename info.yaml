# Tiny Tapeout project information
project:
  title:        "Protocol Emulator: four concurrent programmable I/O engines"      # Project title
  author:       "TeslaCoilerOW"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Four concurrent programmable engines speak UART, SPI, I2C and custom protocols on eight shared I/O pins"      # One line description of what your project does
  language:     "Hardcaml (OCaml)" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_teslacoilerow_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  #
  # protocol_emulator_core.v is generated by scripts/generate.sh from hardcaml/
  # and configs/instruction-sram-32.json; CI (regen.yaml) checks it is current.
  #
  # Note for the SRAM flow: the core instantiates eight RM_IHPSG13_1P_64x16_c2
  # hard macros. tt-support-tools passes exactly these files to LibreLane as
  # VERILOG_FILES, so never list the behavioral models in models/ here (they
  # would be synthesized into flops). The macro's interface comes from the
  # MACROS entry in src/config.json (vh/nl = an interface-only header such as
  # models/blackbox/RM_IHPSG13_1P_64x16_c2.v, plus lef/gds/lib). Alternatively,
  # follow urish/ttihp-sram-test: add an empty-module stub to src/ and list it
  # here (Yosys treats empty modules as blackboxes).
  source_files:
    - "project.v"
    - "protocol_emulator_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# uio pins are general-purpose protocol pins; names show the flagship firmware
# assignment (firmware/flagship-scenario.json). Any engine can own any pin.
pinout:
  # Inputs
  ui[0]: "HOST_WDATA0 (host write nibble bit 0)"
  ui[1]: "HOST_WDATA1 (host write nibble bit 1)"
  ui[2]: "HOST_WDATA2 (host write nibble bit 2)"
  ui[3]: "HOST_WDATA3 (host write nibble bit 3)"
  ui[4]: "HOST_WVALID (host write nibble valid)"
  ui[5]: "HOST_RREADY (host read nibble ready)"
  ui[6]: "HOST_WINDOW0 (window select bit 0)"
  ui[7]: "HOST_WINDOW1 (window select bit 1)"

  # Outputs
  uo[0]: "HOST_RDATA0 (host read nibble bit 0)"
  uo[1]: "HOST_RDATA1 (host read nibble bit 1)"
  uo[2]: "HOST_RDATA2 (host read nibble bit 2)"
  uo[3]: "HOST_RDATA3 (host read nibble bit 3)"
  uo[4]: "HOST_WREADY (host write nibble ready)"
  uo[5]: "HOST_RVALID (host read nibble valid)"
  uo[6]: "IRQ (event pending or RX FIFO non-empty)"
  uo[7]: "FAULT (sticky host fault or engine fault)"

  # Bidirectional pins
  uio[0]: "PIN0 (flagship: UART TX, engine 0)"
  uio[1]: "PIN1 (flagship: UART RX, engine 1)"
  uio[2]: "PIN2 (flagship: SPI SCK, engine 2)"
  uio[3]: "PIN3 (flagship: SPI MOSI, engine 2)"
  uio[4]: "PIN4 (flagship: SPI MISO, engine 2)"
  uio[5]: "PIN5 (flagship: SPI CS_N, engine 2)"
  uio[6]: "PIN6 (flagship: I2C SCL open-drain, engine 3)"
  uio[7]: "PIN7 (flagship: I2C SDA open-drain, engine 3)"

# Do not change!
yaml_version: 6
