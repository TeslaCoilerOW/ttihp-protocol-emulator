name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Same Icarus build as TinyTapeout/tt-gds-action/gl_test, so RTL and
      # gate-level runs use one simulator version.
      - name: Install iverilog
        shell: bash
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # The design selection (configs/design-selection.txt) names the variant
      # whose core src/ carries: the suite runs that variant's reference model
      # (PE_VARIANT) against src/ (PE_CORE, for a variant other than base; for
      # base test/Makefile uses src/ directly). test/Makefile defaults to the
      # same selection, which the gate-level run of the gds workflow uses.
      - name: Design selection
        shell: bash
        run: |
          variant=$(scripts/design_selection.sh variant)
          scripts/design_selection.sh check
          echo "PE_VARIANT=$variant" >> "$GITHUB_ENV"
          if [ "$variant" != base ]; then
            echo "PE_CORE=$GITHUB_WORKSPACE/src/protocol_emulator_core.v" >> "$GITHUB_ENV"
          fi

      # RTL simulation needs the IHP SRAM behavioral models, which are
      # committed under models/ (Apache-2.0, see models/NOTICE.IHP-Open-PDK);
      # test/Makefile adds them with -DFUNCTIONAL.
      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          test -f results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # The SWD, WS2812B, PS/2 and 1-Wire images (test/test_protocols_ext.py), RTL
  # only. They are not in COCOTB_TEST_MODULES, so neither the job above nor the
  # gate-level test of the gds workflow runs them. About 7 minutes.
  protocols-ext:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        shell: bash
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run test_protocols_ext (RTL)
        run: |
          cd test
          make clean
          make COCOTB_TEST_MODULES=test_protocols_ext
          test -f results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-protocols-ext
          path: |
            test/results.xml

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog, yosys and verilator
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator

      # iverilog elaboration with the SRAM models, yosys hierarchy -check and
      # verilator -Wall lint (the check LibreLane runs first in the gds flow).
      - name: Static checks
        run: scripts/lint.sh
