name: formal
# SymbiYosys proofs, bounded checks, covers and negative controls over RTL
# generated from hardcaml/ (see formal/README.md). The OCaml pins and opam
# cache are the same as regen.yaml; the OSS CAD Suite release is pinned.
#
# The design is the design selection (configs/design-selection.txt, read by
# scripts/design_selection.sh). For base (configs/instruction-sram-32.json)
# every job of `formal/run.sh --list` runs. For a variant NAME
# (configs/variants/NAME.json) the jobs of `formal/run.sh --variant NAME
# --list` run with the variant's settings; for a variant with the line unit,
# its line_* jobs are the CI subset `formal/run.sh --variant NAME --ci --list`
# (every line_* job except the long bounded checks, formal/README.md). The
# generated variant core must equal src/protocol_emulator_core.v below its
# header line (VARIANT_CORES).
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  OCAML_COMPILER: "5.2.1"
  OSS_CAD_SUITE: "2026-07-29"

jobs:
  rtl:
    name: generate formal RTL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      variant: ${{ steps.design.outputs.variant }}
      build: ${{ steps.design.outputs.build }}
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Design selection
        id: design
        shell: bash
        run: |
          variant=$(scripts/design_selection.sh variant)
          scripts/design_selection.sh check
          if [ "$variant" = base ]; then
            build=formal/build
          else
            build=formal/build/variants/$variant
          fi
          { echo "variant=$variant"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

      - name: Install system packages
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev pkg-config

      - name: Restore opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-ocaml-${{ env.OCAML_COMPILER }}-${{ hashFiles('scripts/opam-deps.txt') }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          cache: false
          opam-pin: false

      - name: Install pinned opam packages
        shell: bash
        run: |
          # One package per word of scripts/opam-deps.txt, so no quotes.
          # shellcheck disable=SC2046
          opam install --yes $(grep -v '^#' scripts/opam-deps.txt)
          opam list --installed --columns=name,version hardcaml yojson digestif dune

      - name: Generate formal RTL
        shell: bash
        env:
          DESIGN_VARIANT: ${{ steps.design.outputs.variant }}
        run: |
          if [ "$DESIGN_VARIANT" = base ]; then
            opam exec -- formal/run.sh --generate-only
          else
            # run.sh compares the variant core it generates with this copy of
            # src/ below the header line and fails if they differ.
            mkdir -p "$RUNNER_TEMP/cores"
            cp src/protocol_emulator_core.v "$RUNNER_TEMP/cores/$DESIGN_VARIANT.v"
            VARIANT_CORES=$RUNNER_TEMP/cores opam exec -- \
              formal/run.sh --variant "$DESIGN_VARIANT" --generate-only
          fi

      - name: Select the formal jobs
        id: jobs
        shell: bash
        env:
          DESIGN_VARIANT: ${{ steps.design.outputs.variant }}
        run: |
          t=$RUNNER_TEMP
          if [ "$DESIGN_VARIANT" = base ]; then
            formal/run.sh --list > "$t/all.txt"
            cp "$t/all.txt" "$t/jobs.txt"
          else
            formal/run.sh --variant "$DESIGN_VARIANT" --list > "$t/all.txt"
            if grep -q '^line_' "$t/all.txt"; then
              # The jobs without the line unit, then the line-unit CI subset.
              formal/run.sh --variant "$DESIGN_VARIANT" --ci --list > "$t/ci.txt"
              # The subset must name at least one line_* job, only line_*
              # jobs, and only jobs of --list.
              if ! grep -q '^line_' "$t/ci.txt"; then
                echo "::error::formal/run.sh --ci --list selects no line-unit job"
                exit 1
              fi
              if grep -qv '^line_' "$t/ci.txt"; then
                echo "::error::formal/run.sh --ci --list names a job that is not a line-unit job"
                exit 1
              fi
              if grep -qvxF -f "$t/all.txt" "$t/ci.txt"; then
                echo "::error::formal/run.sh --ci --list names a job that --list does not"
                exit 1
              fi
              { grep -v '^line_' "$t/all.txt"; cat "$t/ci.txt"; } > "$t/jobs.txt"
            else
              cp "$t/all.txt" "$t/jobs.txt"
            fi
          fi
          if grep -qvE '^[a-z0-9_]+$' "$t/jobs.txt"; then
            echo "::error::unexpected formal job name"
            exit 1
          fi
          [ -s "$t/jobs.txt" ] || { echo "::error::no formal jobs selected"; exit 1; }
          jobs=$(python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))' < "$t/jobs.txt")
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          excluded=$(grep -vxF -f "$t/jobs.txt" "$t/all.txt" | tr '\n' ' ' || true)
          {
            echo "### Formal jobs (design: $DESIGN_VARIANT)"
            echo
            echo "$(wc -l < "$t/jobs.txt") of $(wc -l < "$t/all.txt") jobs: $(tr '\n' ' ' < "$t/jobs.txt")"
            if [ -n "$excluded" ]; then
              echo
              echo "Not in the CI subset (formal/run.sh --ci): $excluded"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload formal RTL
        uses: actions/upload-artifact@v7
        with:
          name: formal-rtl
          path: ${{ steps.design.outputs.build }}/rtl/
          if-no-files-found: error

  sby:
    name: ${{ matrix.job }}
    needs: rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.rtl.outputs.jobs) }}
    env:
      DESIGN_VARIANT: ${{ needs.rtl.outputs.variant }}
      FORMAL_BUILD: ${{ needs.rtl.outputs.build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download formal RTL
        uses: actions/download-artifact@v8
        with:
          name: formal-rtl
          path: ${{ needs.rtl.outputs.build }}/rtl

      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tool versions
        run: yosys -V && sby --version

      - name: Run ${{ matrix.job }}
        shell: bash
        env:
          SBY_TIMEOUT: "1500"
          JOB: ${{ matrix.job }}
        run: |
          if [ "$DESIGN_VARIANT" = base ]; then
            formal/run.sh --no-generate "$JOB"
          else
            formal/run.sh --variant "$DESIGN_VARIANT" --no-generate "$JOB"
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$FORMAL_BUILD/summary.tsv" ]; then
            { echo '```'; column -t -s $'\t' "$FORMAL_BUILD/summary.tsv"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sby logs and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sby-${{ matrix.job }}
          path: |
            ${{ needs.rtl.outputs.build }}/summary.tsv
            ${{ needs.rtl.outputs.build }}/sby/*.log
            ${{ needs.rtl.outputs.build }}/sby/*/logfile.txt
            ${{ needs.rtl.outputs.build }}/sby/*/status
            ${{ needs.rtl.outputs.build }}/sby/*/engine_*/*.vcd
            ${{ needs.rtl.outputs.build }}/sby/*/engine_*/*.yw
          if-no-files-found: ignore
