name: regen
# Regenerates src/protocol_emulator_core.v from hardcaml/ and the configuration
# named by the design selection (configs/design-selection.txt, read by
# scripts/design_selection.sh) with the pinned OCaml toolchain, and fails if
# the committed file is not current.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  OCAML_COMPILER: "5.2.1"

jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # The configuration src/protocol_emulator_core.v is generated from.
      - name: Design selection
        id: design
        shell: bash
        run: |
          config=$(scripts/design_selection.sh config)
          scripts/design_selection.sh check
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Install system packages
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev pkg-config

      # setup-ocaml does not cache project dependencies, so cache the local
      # switch ourselves, keyed on the exact compiler and the pin list.
      - name: Restore opam switch
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-ocaml-${{ env.OCAML_COMPILER }}-${{ hashFiles('scripts/opam-deps.txt') }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          cache: false
          opam-pin: false

      - name: Install pinned opam packages
        shell: bash
        run: |
          # One package per word of scripts/opam-deps.txt, so no quotes.
          # shellcheck disable=SC2046
          opam install --yes $(grep -v '^#' scripts/opam-deps.txt)
          opam list --installed --columns=name,version hardcaml yojson digestif dune zarith base ppxlib

      - name: Regenerate core RTL
        shell: bash
        env:
          DESIGN_CONFIG: ${{ steps.design.outputs.config }}
        run: opam exec -- scripts/generate.sh "$DESIGN_CONFIG"

      - name: Check committed RTL is current
        shell: bash
        env:
          DESIGN_CONFIG: ${{ steps.design.outputs.config }}
        run: |
          git status --short -- src
          if ! git diff --exit-code --stat -- src; then
            echo "::error::src/ is out of date with hardcaml/ and $DESIGN_CONFIG. Run scripts/generate.sh $DESIGN_CONFIG and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- src)
          if [ -n "$untracked" ]; then
            echo "::error::generation left untracked files in src/: $untracked"
            exit 1
          fi

      - name: Upload regenerated RTL
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-rtl
          path: src/protocol_emulator_core.v
